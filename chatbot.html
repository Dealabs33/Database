<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Chat with us</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- External CSS Frameworks -->
    <link href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body class="has-background-light">

<!-- Chatbot Container -->
<div class="container section">
    <div class="card animate__animated animate__fadeIn">
        <div class="card-content">
            <span class="card-title">
                <i class="fas fa-robot"></i> DEALABS Chatbot v4.5
            </span>
            <div class="divider"></div>
            <div id="chatBody" class="chat-body mt-4" style="height: 400px; overflow-y: auto;">
                <div class="bot-message notification is-light">
                    <strong>DEALABSbot:</strong> Hello! How can I assist you today? 😊
                </div>
            </div>
        </div>

        <!-- User Input Section -->
        <div class="card-action">
            <div class="field is-grouped">
                <div class="control is-expanded">
                    <input class="input" type="text" id="userInput" placeholder="Type a message...">
                </div>
                <div class="control">
                    <button class="button is-info" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i> Send
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- External JS Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.3.5/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<!-- Include reply.js -->
<script src="reply.js"></script>

<!-- Chatbot Logic -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        M.AutoInit();
        particlesJS.load('chatBody', 'https://cdn.jsdelivr.net/particles.js/2.0.0/particles.json');

        Swal.fire({
            title: 'Welcome!',
            text: 'Ask me anything!',
            icon: 'info',
            confirmButtonText: 'Okay'
        });
    });

    async function sendMessage() {
        const userInput = document.getElementById('userInput').value;
        const chatBody = document.getElementById('chatBody');

        if (userInput.trim() === '') return;

        // User message display
        const userMessage = document.createElement('div');
        userMessage.className = 'user-message notification is-primary';
        userMessage.innerHTML = `<strong>You:</strong> ${userInput}`;
        chatBody.appendChild(userMessage);

        document.getElementById('userInput').value = '';

        // Simulate AI Response
        setTimeout(async () => {
            const botMessage = document.createElement('div');
            botMessage.className = 'bot-message notification is-light';
            
            const response = getResponse(userInput);
            botMessage.innerHTML = `<strong>DEALABSbot:</strong> ${response}`;

            chatBody.appendChild(botMessage);
            chatBody.scrollTop = chatBody.scrollHeight;
        }, 1000);
    }

    // Get response from the predefined responses in reply.js
    function getResponse(userInput) {
        const userInputLower = userInput.toLowerCase();
        for (const key in responses) {
            if (userInputLower === key.toLowerCase()) {
                return responses[key];
            }
        }
        return "Hmm... I'm not sure about that. 🤖";
    }
</script>

</body>
</html>
